[mcu]
serial: /dev/ttyS0
restart_method: command

[mcu host]
serial: /tmp/klipper_host_mcu


[include mainsail.cfg]
[include Macros.cfg]
[include SpeedTest.cfg]
[include BkpUpdate.cfg]
[exclude_object]
[gcode_arcs]
resolution: 0.25
#[endstop_phase]
[pause_resume]
[respond]
[exclude_object]
#[include klicky-probe.cfg]


#[include ADXL345.cfg]
#[include ADXL345B.cfg]
#[include S2DW.cfg]

[virtual_sdcard]
path: /home/biqu/printer_data/gcodes

[idle_timeout]
timeout: 72000

#####################################################################
# 	XY Stepper Settings
#####################################################################


[stepper_x]
step_pin:PC14
dir_pin:PC13
enable_pin:!PC15
microsteps: 32
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin:PA14
position_min: -10  
position_endstop: 368 #356
position_max: 368 #356
homing_speed:50
homing_retract_dist:5
homing_positive_dir:true


[tmc2209 stepper_x]
uart_pin: PE6
run_current: 0.8
interpolate: True
#stealthchop_threshold: 9999

[stepper_y]
step_pin:PE5
dir_pin:PE4
enable_pin:!PD14
microsteps:32
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin:PA15
position_min: -20
position_endstop:372
position_max:372
homing_speed:50
homing_retract_dist:5
homing_positive_dir:true

[tmc2209 stepper_y]
uart_pin: PE3
run_current: 0.8
interpolate: True
#stealthchop_threshold: 9999

[autotune_tmc stepper_x]
motor: moons-c17hd2024n-01n #creality-42-34
#tuning_goal: silent

[autotune_tmc stepper_y]
motor: creality-42-48
#tuning_goal: silent

[autotune_tmc stepper_z]
motor: creality-42-34
tuning_goal: silent

[autotune_tmc stepper_z1]
motor: creality-42-34
tuning_goal: silent

[autotune_tmc extruder]
motor: BJ42D09-20V02
tuning_goal: performance

#####################################################################
# 	Z Stepper Settings
#####################################################################
[stepper_z]
step_pin:PE1
dir_pin:PE0
enable_pin: !PE2
microsteps: 32
rotation_distance: 4
full_steps_per_rotation: 200
endstop_pin:probe:z_virtual_endstop
position_max: 400
position_min: -5 
homing_speed: 8
second_homing_speed: 3

[tmc2209 stepper_z]
uart_pin: PB7
interpolate: True
run_current: 0.8
#stealthchop_threshold: 9999

[stepper_z1]
step_pin:PB5
dir_pin:PB4
enable_pin:!PB6
microsteps:32
rotation_distance: 4
full_steps_per_rotation: 200

[tmc2209 stepper_z1]
uart_pin: PB3
interpolate: True
run_current: 0.8
#stealthchop_threshold: 9999

#####################################################################
# 	Probe
#####################################################################

[bltouch]
sensor_pin: ^PB15
control_pin: PA8
pin_up_touch_mode_reports_triggered: False
x_offset: 42
y_offset: 0.6
#z_offset: 1.3
speed: 15
samples: 3
sample_retract_dist: 2.0
samples_tolerance_retries: 1
#samples_result: median
stow_on_each_sample: false
probe_with_touch_mode: true

[z_tilt]
z_positions: -81,183
             374,183
points: -7,32.5
       298,32.5
speed: 150
horizontal_move_z: 15
retry_tolerance: 0.005
retries: 10

[bed_mesh]
algorithm: bicubic
speed: 100
horizontal_move_z: 8
mesh_min: 35,32.5
mesh_max: 340,337.5
probe_count: 17,17
mesh_pps: 3,3
fade_start: 1
fade_end: 10
split_delta_z: 0.05
#fade_target: 0

[safe_z_home]
home_xy_position: 145.5,185 # Change coordinates to the center of your print bed
speed: 200
z_hop: 10                # Move up 10mm
z_hop_speed: 10

#####################################################################
# 	Extruder
#####################################################################

[extruder]
step_pin:PD6
dir_pin:!PD5
enable_pin:!PD7
microsteps:16
gear_ratio: 42:12
rotation_distance: 26.3 #26.359 #26.72
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: -100
max_temp: 275
min_extrude_temp: 17
heater_pin: PB0
sensor_type:  NTC 100K MGB18-104F39050L32
sensor_pin: PC1
max_power: 1.0
max_extrude_cross_section: 500 
max_extrude_only_distance: 1100

pressure_advance: 0.00
pressure_advance_smooth_time: 0.01

control : pid #220
pid_kp : 25.878
pid_ki : 1.287
pid_kd : 130.037


[input_shaper]
shaper_freq_x: 43.2
shaper_type_x: mzv
damping_ratio_x: 0.044

shaper_freq_y: 39.8
shaper_type_y: mzv
damping_ratio_y: 0.047

[tmc2209 extruder]
uart_pin: PD4
run_current: 0.8
hold_current: 0.5
interpolate: True
stealthchop_threshold: 400

[filament_switch_sensor e0_sensor]
pause_on_runout: true
runout_gcode: 
  M600
switch_pin: !PA13

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
heater_pin: PD12
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PC0
max_power: 1.0
min_temp: -100
max_temp: 130

control: pid #60
pid_kp: 66.462
pid_ki: 0.813
pid_kd: 1358.322


#####################################################################
# 	Fan Control
#####################################################################

[fan]
pin: PA0

[heater_fan fan1]
pin: PA2

[temperature_sensor Skipr]
sensor_type: temperature_host 
min_temp: 0
max_temp: 100

[temperature_fan MCU]
pin: PA3
max_power: 1.0
min_temp: 0
max_temp: 100
off_below: 0.1
shutdown_speed: 0
sensor_type: temperature_mcu
control: pid
pid_kp: 10.0
pid_ki: 1.0
pid_kd: 200.0
pid_deriv_time: 2.0
min_speed: 0.0
max_speed: 1.0
target_temp: 36

[temperature_sensor Bed_2]
sensor_pin: PC3 # T2
sensor_type: EPCOS 100K B57560G104F
min_temp: 0
max_temp: 120

#####################################################################
# Kinematics Settings
#####################################################################

[printer]
kinematics:cartesian
max_velocity: 200
max_accel: 4000
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity: 5

